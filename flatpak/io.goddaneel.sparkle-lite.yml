id: io.goddaneel.sparkle-lite
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
#runtime: org.gnome.Platform
#runtime-version: '50'
#sdk: org.gnome.Sdk
command: sparkle-lite




finish-args:
  - --share=network
  - --socket=wayland
  - --device=dri
  - --persist="."
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher




modules:
  - name: sparkle
    buildsystem: simple
    build-commands:
      - install -v -d -m 0755 "/app"
      - install -v -d -m 0755 "/app/lib"
      - install -v -d -m 0755 "/app/usr"
      - install -v -d -m 0755 "/app/share"
      - install -v -d -m 0755 "/app/opt"

      - cp -rv "./lib" "/app/usr"
      - cp -rv "./share" "/app/usr"
      - cp -rv "./share/icons" "/app/share"
      - cp -rv "./sparkle" "/app/opt"

      - ln -sv "/app/usr/lib/.build-id" "/app/lib/.build-id"

      - for _ls_loop in "/app/share/icons/hicolor/"* ; do
          mv -v "${_ls_loop}/apps/"{"sparkle","io.goddaneel.sparkle-lite"}".png" ;
        done

      - chmod -c a+x "/app/opt/sparkle/chrome-sandbox"
      - chmod -c -R -P go-w "/app"


    sources:
      - type: archive
        url: https://github.com/xishang0128/sparkle/releases/download/1.26.8/sparkle-linux-1.26.8-x86_64.rpm
        sha256: a862ec530aa3e5a742917a59d2d12e4517a4292d3a0815f921380d4d94d67efc



  - name: sparkle-patch
    buildsystem: simple
    build-commands:
      - install -v -d -m 0755 "/app/bin"
      - install -v -d -m 0755 "/app/share/metainfo"
      - install -v -d -m 0755 "/app/share/applications"

      - install -v -m 0755 "./flatpak/extra/bin/sparkle-lite" "/app/bin/"
      - install -v -m 0644 "./flatpak/extra/metainfo/io.goddaneel.sparkle-lite.metainfo.xml" "/app/share/metainfo/"
      - install -v -m 0644 "./flatpak/extra/applications/io.goddaneel.sparkle-lite.desktop" "/app/share/applications/"


    sources:
      - type: dir
        path: "../"