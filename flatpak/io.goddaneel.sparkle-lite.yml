id: io.goddaneel.sparkle-lite
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: sparkle-lite




finish-args:
  - --share=network
  - --socket=wayland
  - --device=dri
  - --persist="."
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher




modules:
  - name: sparkle
    buildsystem: simple
    build-commands:
      - install -v -d -m 0755 "/app/opt"
      - install -v -d -m 0755 "./archive/extract"

      - tar --use-compress-program=unzstd -vxf
        "./archive/sparkle-linux-x64.pkg.tar.zst"
        -C "./archive/extract"

      - cp -rv
        "./archive/extract/opt"
        "/app"

      - rm -rv "./archive"

      - chmod -c a+x "/app/opt/sparkle/chrome-sandbox"
      - chmod -c a+x "/app/opt/sparkle/resources/files/sparkle-service"
      - chmod -c a+x "/app/opt/sparkle/resources/sidecar/mihomo"
      - chmod -c a+x "/app/opt/sparkle/resources/sidecar/mihomo-alpha"
      - chmod -c -R -P go-w "/app"


    sources:
      - type: file
        dest: "./archive"
        dest-filename: "sparkle-linux-x64.pkg.tar.zst"
        url: https://github.com/xishang0128/sparkle/releases/download/1.26.7/sparkle-linux-1.26.7-x64.pkg.tar.zst
        sha256: 180e0da87de0487da80cb6d62c8efc773bcd41a50c48954de9abb6f38c840640



  - name: sparkle-patch
    buildsystem: simple
    build-commands:
      - install -v -d -m 0755 "/app/bin"
      - install -v -d -m 0755 "/app/share/metainfo"
      - install -v -d -m 0755 "/app/share/doc"
      - install -v -d -m 0755 "/app/share/applications"
      - install -v -d -m 0755 "/app/share/icons/hicolor/512x512/apps"

      - install -v -m 0755 
        "./flatpak/extra/bin/sparkle-lite"
        "/app/bin/"
      - install -v -m 0644 
        "./flatpak/extra/metainfo/io.goddaneel.sparkle-lite.metainfo.xml"
        "/app/share/metainfo/"
      - install -v -m 0644 
        "./flatpak/extra/applications/io.goddaneel.sparkle-lite.desktop"
        "/app/share/applications/"
      - install -v -m 0644 
        "./patch/resources/icon.png"
        "/app/share/icons/hicolor/512x512/apps/io.goddaneel.sparkle-lite.png"


    sources:
      - type: dir
        path: "../"