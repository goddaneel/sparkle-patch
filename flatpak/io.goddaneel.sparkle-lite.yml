id: io.goddaneel.sparkle-lite
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: sparkle-lite




finish-args:
  - --share=network
  - --socket=wayland
  - --device=dri
  - --persist="."
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher




modules:
  - name: sparkle
    buildsystem: simple
    build-commands:
      - dpkg-deb -R
        "./archive/sparkle.deb"
        "./archive/sparkle.deb_R"

      - cp -rv 
        "./archive/sparkle.deb_R/usr/share/doc/sparkle"
        "/app/share/doc"
      - cp -rv
        "./archive/sparkle.deb_R/opt"
        "/app"

      - chmod -c a+x "/app/opt/sparkle/chrome-sandbox"
      - chmod -c a+x "/app/opt/sparkle/resources/files/sparkle-service"
      - chmod -c a+x "/app/opt/sparkle/resources/sidecar/mihomo"
      - chmod -c a+x "/app/opt/sparkle/resources/sidecar/mihomo-alpha"
      - chmod -c -R -P go-w "/app"


    sources:
      - type: file
        dest: './archive'
        dest-filename: sparkle.deb
        url: https://github.com/xishang0128/sparkle/releases/download/1.26.7/sparkle-linux-1.26.7-amd64.deb
        sha256: 0e3c8c91b206bbdfa517d57b8646184301214220d50e3b020f96d2fec593e6c2



  - name: sparkle-patch
    buildsystem: simple
    build-commands:
      - install -v -d -m 0755 "/app/bin"
      - install -v -d -m 0755 "/app/share/metainfo"
      - install -v -d -m 0755 "/app/share/doc"
      - install -v -d -m 0755 "/app/share/applications"
      - install -v -d -m 0755 "/app/share/icons/hicolor/512x512/apps"
      - install -v -d -m 0755 "/app/opt"

      - install -v -m 0755 
        "./flatpak/extra/bin/sparkle-lite"
        "/app/bin/"
      - install -v -m 0644 
        "./flatpak/extra/metainfo/io.goddaneel.sparkle-lite.metainfo.xml"
        "/app/share/metainfo/"
      - install -v -m 0644 
        "./flatpak/extra/applications/io.goddaneel.sparkle-lite.desktop"
        "/app/share/applications/"
      - install -v -m 0644 
        "./patch/resources/icon.png"
        "/app/share/icons/hicolor/512x512/apps/io.goddaneel.sparkle-lite.png"

      - chmod -c -R -P go-w "/app"


    sources:
      - type: dir
        path: "../"